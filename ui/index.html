<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080b12">
<title>Replay Capture</title>
<style>
  :root { color-scheme:dark; --bg:#080b12; --panel:#0f1623; --panel2:#111827; --line:#1e2a3d; --text:#eef3ff; --muted:#91a0ba; --gold:#c79b3b; --gold2:#e8be61;
    --kill:#4ade80; --death:#f87171; --assist:#60a5fa; --won:#4ade80; --lost:#f87171; --fight:#fbbf24; --obj:#a78bfa; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; display:grid; grid-template-columns:360px 1fr; height:100vh }
  aside { border-right:1px solid var(--line); overflow:auto; display:flex; flex-direction:column; background:var(--bg) }
  aside header { padding:18px 16px 14px; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:1; background:linear-gradient(145deg, #101a2a, #080b12 75%); border-bottom:1px solid var(--line) }
  aside header b { font-size:22px; letter-spacing:-.03em }
  #status { font-size:12px; color:var(--muted) } #status.rec { color:var(--kill); font-weight:700 }
  #list { display:grid; gap:9px; padding:12px }
  .item { display:grid; grid-template-columns:104px 1fr; gap:4px 12px; padding:10px; border:1px solid var(--line); border-radius:14px; background:var(--panel); cursor:pointer }
  .item:hover { border-color:#2a3850 } .item.active { border-color:var(--gold); background:#172236 } .item:active { transform:scale(.99) }
  .item img { grid-row:1 / span 3; width:104px; height:58px; object-fit:cover; border-radius:8px; background:#000 }
  .item .t { font-weight:760; font-size:15px; line-height:1.2 } .item .s { color:var(--muted); font-size:12px } .item .g { color:var(--gold); font-weight:800 }
  .item.deleted { opacity:.5 }
  main { display:flex; flex-direction:column; min-width:0; padding:14px; gap:10px; overflow:auto }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap }
  button { background:var(--panel2); color:var(--text); border:1px solid #2a3850; border-radius:10px; padding:7px 11px; cursor:pointer; font:inherit; font-weight:700 }
  button:hover { border-color:var(--gold) } button:active { background:var(--gold); color:#111 }
  button.primary { background:var(--gold); border-color:var(--gold2); color:#111 } button.danger:hover { border-color:var(--death); color:var(--death) }
  input[type=text] { background:var(--panel2); color:var(--text); border:1px solid #2a3850; border-radius:10px; padding:7px 9px; font:inherit }
  #title { font-size:17px } #sub { color:var(--muted) } #fav.on { color:var(--gold2); border-color:var(--gold) }
  /* Player: custom controls over the video, markers on the seek bar, pinch/wheel zoom + drag pan. */
  .viewport { position:relative; overflow:hidden; border-radius:13px; background:#000; box-shadow:0 12px 32px rgba(0,0,0,.35); touch-action:none; user-select:none; -webkit-user-select:none }
  video { display:block; width:100%; max-height:62vh; background:#000; transform-origin:0 0 }
  .controls { position:absolute; inset:auto 0 0 0; display:flex; align-items:center; gap:8px; padding:26px 10px 8px; background:linear-gradient(transparent, rgba(8,11,18,.94) 50%); transition:opacity .25s }
  .viewport.idle .controls { opacity:0; pointer-events:none } .viewport.idle { cursor:none }
  .controls button { background:rgba(8,11,18,.82); border-color:rgba(220,230,248,.55); padding:6px 10px; min-width:38px }
  #time { color:#d6e0f2; font-size:12px; font-variant-numeric:tabular-nums; white-space:nowrap }
  #zoomReset[hidden] { display:none }
  #speedWrap { position:relative } #speed { min-width:46px; font-variant-numeric:tabular-nums }
  #speeds { position:absolute; right:0; bottom:calc(100% + 6px); display:flex; gap:2px; padding:4px; background:rgba(8,11,18,.96); border:1px solid #2a3850; border-radius:10px; z-index:5 }
  #speeds[hidden] { display:none } #speeds button { border:0; padding:6px 9px; min-width:0 } #speeds button.on { color:var(--gold2) }
  #track { position:relative; flex:1; min-width:80px; height:28px; cursor:pointer; touch-action:none }
  #track .bar { position:absolute; left:0; right:0; top:12px; height:4px; border-radius:2px; background:rgba(220,230,248,.25) }
  #track .fill { position:absolute; left:0; top:12px; height:4px; border-radius:2px; background:var(--gold) }
  #track .mark { position:absolute; top:6px; width:3px; height:16px; margin-left:-1px; border-radius:2px; pointer-events:none }
  #track .range { position:absolute; top:4px; height:20px; background:rgba(199,155,59,.3); border-radius:3px; pointer-events:none }
  #track .thumb { position:absolute; top:7px; width:14px; height:14px; margin-left:-7px; border-radius:50%; background:var(--gold2); box-shadow:0 0 0 3px rgba(8,11,18,.6); pointer-events:none }
  .viewport:fullscreen { width:100%; height:100%; border-radius:0; display:flex; align-items:center }
  .viewport:fullscreen video { max-height:100vh; height:100% }
  .events { display:flex; flex-wrap:wrap; gap:6px }
  .ev { padding:4px 10px; border-radius:999px; font-size:12px; border:1px solid var(--line); cursor:pointer; background:var(--panel); white-space:nowrap }
  .ev.now { background:#172236; box-shadow:0 0 0 1px var(--gold) inset }
  .clips { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:10px }
  .clip { background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden } .clip img { width:100%; aspect-ratio:16/9; object-fit:cover; display:block; background:#000 } .clip div { padding:8px; font-size:12px; display:flex; justify-content:space-between; align-items:center; gap:6px }
  .muted { color:var(--muted) } .empty { color:var(--muted); padding:40px; text-align:center }
  .menu, #scrim { display:none }
  /* Phone: recordings list becomes a drawer; the video gets the screen. */
  @media (max-width:900px), (max-height:500px) {
    body { display:block; height:auto }
    aside { position:fixed; z-index:20; inset:0 auto 0 0; width:min(360px, 88vw); transform:translateX(-100%); transition:transform .2s }
    body.drawer aside { transform:none }
    body.drawer #scrim { display:block; position:fixed; inset:0; z-index:10; background:rgba(0,0,0,.55) }
    .menu { display:inline-block; font-size:17px; padding:5px 11px }
    main { padding:6px max(8px, env(safe-area-inset-right)) 8px max(8px, env(safe-area-inset-left)); gap:6px; overflow:visible }
    #player:not([hidden]) { display:flex; flex-direction:column; gap:6px }
    #top { flex-wrap:nowrap; gap:6px }
    #top > .name { min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; flex:1 }
    #title { font-size:15px } #sub { font-size:12px }
    .lbl, #open, #clipName, #preciseLbl { display:none }
    #clipbar { flex-wrap:nowrap; gap:6px; margin-left:auto }
    .controls { gap:6px; padding:22px 8px 6px }
    .events { flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; padding-bottom:2px }
    .ev { flex:none; padding:6px 11px; font-size:13px }
  }
  @media (max-height:500px) and (orientation:landscape) {
    video { max-height:none; height:calc(100dvh - 92px); object-fit:contain }
  }
</style>
</head>
<body>
<aside>
  <header><b>Replay Capture</b><span id="status">…</span></header>
  <div id="list"></div>
</aside>
<div id="scrim"></div>
<main>
  <div id="empty" class="empty"><p>Pick a recording. Recordings start by themselves when TFT or League launches.</p><button class="menu">☰ Recordings</button></div>
  <div id="player" hidden>
    <div id="top" class="row">
      <button class="menu" title="Recordings">☰</button>
      <div class="name"><b id="title"></b> <span id="sub"></span></div>
      <div id="clipbar" class="row">
        <button id="setIn" title="Set clip start (i)">[ In</button><button id="setOut" title="Set clip end (o)">Out ]</button><span id="range" class="muted">no range</span>
        <input id="clipName" type="text" placeholder="clip name (optional)" style="min-width:160px">
        <label id="preciseLbl" class="muted"><input id="precise" type="checkbox"> frame-precise</label>
        <button id="cut" class="primary">Clip</button><span id="cutMsg" class="muted"></span>
      </div>
      <button id="fav" title="Favourites are never auto-deleted"></button><button id="open">Open folder</button><button id="del" class="danger" title="Delete recording">🗑<span class="lbl"> Delete</span></button>
    </div>
    <div class="viewport" id="vp">
      <video id="video" preload="metadata" playsinline></video>
      <div class="controls">
        <button id="play">▶</button><button id="mute">🔊</button>
        <div id="track"><div class="bar"></div><div class="fill" id="fill"></div><div id="marks"></div><div class="range" id="rg"></div><div class="thumb" id="thumb"></div></div>
        <span id="time">0:00 / 0:00</span><button id="zoomReset" hidden title="Reset zoom">Zoom ✕</button><span id="speedWrap"><button id="speed" title="Playback speed">1×</button><div id="speeds" hidden></div></span><button id="fs" title="Full screen">⛶</button>
      </div>
    </div>
    <div id="events" class="events"></div>
    <div><b>Clips</b></div><div id="clips" class="clips"></div>
  </div>
</main>
<script>
const $ = (s) => document.querySelector(s);
const colors = { kill:'var(--kill)', death:'var(--death)', assist:'var(--assist)', multikill:'var(--kill)', objective:'var(--obj)', combat_start:'var(--fight)', victory:'var(--won)', round_won:'var(--won)', round_lost:'var(--lost)', game_end:'#fff', game_start:'#fff' };
let items = [], cur = null, shown = [], inT = null, outT = null;
const v = $('#video'), vp = $('#vp');
const compact = matchMedia('(max-width:900px), (max-height:500px)');
const fmt = (s) => { s = Math.max(0, Math.floor(s || 0)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60; return (h?h+':':'') + String(m).padStart(h?2:1,'0') + ':' + String(x).padStart(2,'0'); };
const gb = (b) => (b/1e9).toFixed(2) + ' GB';
const dur = () => (Number.isFinite(v.duration) && v.duration) || cur?.durationSec || 1;

async function api(p, opt) { const r = await fetch(p, opt); if (!r.ok) throw new Error((await r.json().catch(()=>({}))).error || r.statusText); return r.json(); }
async function refreshStatus() { try { const s = await api('/api/status'); const el = $('#status'); el.textContent = s.recording ? `● REC ${s.game} · ${s.events} markers` : (s.obs ? 'idle · OBS ready' : 'OBS not connected'); el.className = s.recording ? 'rec' : ''; } catch { $('#status').textContent = 'service offline'; } }
async function loadList() { items = await api('/api/recordings'); renderList(); }
function setDrawer(open) { document.body.classList.toggle('drawer', open); }
document.querySelectorAll('.menu').forEach((b) => b.onclick = () => setDrawer(true));
$('#scrim').onclick = () => setDrawer(false);

function renderList() {
  const el = $('#list'); el.innerHTML = '';
  if (!items.length) { el.innerHTML = '<div class="empty">No recordings yet.</div>'; return; }
  for (const m of items) {
    const d = document.createElement('div'); d.className = 'item' + (cur?.id===m.id?' active':'') + (m.deleted?' deleted':'');
    const counts = m.events.filter(e=>['kill','round_won'].includes(e.type)).length;
    d.innerHTML = `<img src="/media/${encodeURIComponent(m.id)}.jpg" loading="lazy" onerror="this.style.visibility='hidden'"><div class="t">${m.favorite?'★ ':''}${m.game}</div><div class="s">${new Date(m.startedAt).toLocaleString([], { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' })} · ${fmt(m.durationSec)}</div><div class="s">${counts} highlights · ${m.clips.length} clips · ${m.deleted?'video deleted (quota)':'<span class="g">'+gb(m.sizeBytes)+'</span>'}</div>`;
    d.onclick = () => select(m.id); el.appendChild(d);
  }
}

// TFT logs fight start, "victory" and won/lost per round; show one marker per round at the fight start.
function mergeRounds(events) {
  const out = []; let open = null;
  for (const e of events) {
    if (e.type === 'combat_start') { open = { ...e, label: e.label.replace(/ fight$/, '') }; out.push(open); }
    else if (e.type === 'victory') continue;
    else if ((e.type === 'round_won' || e.type === 'round_lost') && open) { open.type = e.type; open.label = e.label; open = null; }
    else out.push(e);
  }
  return out;
}
const lead = (e) => /^(combat_start|round_)/.test(e.type) ? 2 : 5;

async function select(id) {
  cur = await api('/api/recordings/' + encodeURIComponent(id)); inT = outT = null; renderList(); setDrawer(false);
  $('#empty').hidden = true; $('#player').hidden = false;
  $('#title').textContent = cur.game; $('#sub').textContent = `${new Date(cur.startedAt).toLocaleString([], { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' })} · ${fmt(cur.durationSec)}`;
  $('#fav').innerHTML = (cur.favorite ? '★' : '☆') + '<span class="lbl"> Favourite</span>'; $('#fav').classList.toggle('on', !!cur.favorite);
  v.src = cur.deleted ? '' : '/media/' + encodeURIComponent(cur.file); v.playbackRate = rate; resetZoom();
  shown = mergeRounds(cur.events); renderEvents(); renderClips(); updateRange(); sync();
}
function renderEvents() {
  const mk = $('#marks'); mk.innerHTML = ''; const ev = $('#events'); ev.innerHTML = '';
  shown.forEach((e, i) => {
    const m = document.createElement('div'); m.className = 'mark'; m.style.left = (e.t/dur()*100) + '%'; m.style.background = colors[e.type] || 'var(--muted)'; mk.appendChild(m);
    const chip = document.createElement('span'); chip.className = 'ev'; chip.dataset.i = i; chip.style.borderColor = colors[e.type] || 'var(--line)'; chip.textContent = `${fmt(e.t)} ${e.label||e.type}`; chip.onclick = () => seek(e.t - lead(e), true); ev.appendChild(chip);
  });
}
function seek(t, play) { v.currentTime = Math.max(0, Math.min(dur(), t)); if (play) v.play().catch(()=>{}); sync(); }

// Playback controls
let lastNow = -1;
function sync() {
  const D = dur(), t = v.currentTime || 0, pct = Math.min(100, t/D*100);
  $('#fill').style.width = pct + '%'; $('#thumb').style.left = pct + '%';
  $('#time').textContent = `${fmt(t)} / ${fmt(D)}`; $('#play').textContent = v.paused ? '▶' : '❚❚'; $('#mute').textContent = v.muted ? '🔇' : '🔊';
  let n = -1; shown.forEach((e, i) => { if (e.t - lead(e) <= t + 0.5) n = i; });
  if (n !== lastNow) {
    lastNow = n; document.querySelectorAll('.ev.now').forEach((c) => c.classList.remove('now'));
    const c = document.querySelector(`.ev[data-i="${n}"]`);
    if (c) { c.classList.add('now'); const box = $('#events'); if (box.scrollWidth > box.clientWidth) box.scrollTo({ left: c.offsetLeft - box.clientWidth/2 + c.offsetWidth/2, behavior:'smooth' }); }
  }
}
['timeupdate','play','pause','loadedmetadata','volumechange','seeked'].forEach((ev) => v.addEventListener(ev, sync));
v.addEventListener('loadedmetadata', () => { renderEvents(); updateRange(); });
// Playback speed: remembered across recordings (and visits, when storage is available).
const RATES = [0.25, 0.5, 0.75, 1, 1.25, 1.5, 2, 3];
let rate = 1; try { rate = RATES.includes(+localStorage.rcRate) ? +localStorage.rcRate : 1; } catch {}
function setRate(r) { rate = r; v.playbackRate = r; try { localStorage.rcRate = r; } catch {} $('#speed').textContent = r + '×'; $('#speeds').hidden = true; renderRates(); }
function renderRates() { $('#speeds').innerHTML = ''; for (const r of RATES) { const b = document.createElement('button'); b.textContent = r + '×'; b.className = r === rate ? 'on' : ''; b.onclick = () => setRate(r); $('#speeds').appendChild(b); } }
$('#speed').onclick = () => { $('#speeds').hidden = !$('#speeds').hidden; };
v.addEventListener('loadedmetadata', () => { v.playbackRate = rate; });
setRate(rate);
const togglePlay = () => { if (!v.src) return; v.paused ? v.play().catch(()=>{}) : v.pause(); };
$('#play').onclick = togglePlay;
$('#mute').onclick = () => { v.muted = !v.muted; };
$('#fs').onclick = async () => {
  if (document.fullscreenElement) return document.exitFullscreen();
  try { await vp.requestFullscreen(); await screen.orientation?.lock?.('landscape'); } catch {}
};
const track = $('#track');
track.onpointerdown = (e) => {
  e.stopPropagation(); track.setPointerCapture(e.pointerId);
  const go = (x) => { const r = track.getBoundingClientRect(); seek((x.clientX - r.left)/r.width * dur()); };
  go(e); track.onpointermove = go; track.onpointerup = track.onpointercancel = () => { track.onpointermove = null; };
};
vp.querySelector('.controls').addEventListener('pointerdown', (e) => e.stopPropagation());

// Controls fade while playing; any touch or mouse move brings them back.
let idleTimer;
function wake() { vp.classList.remove('idle'); clearTimeout(idleTimer); idleTimer = setTimeout(() => { if (!v.paused) vp.classList.add('idle'); }, 2500); }
vp.addEventListener('pointermove', wake); v.addEventListener('pause', wake); v.addEventListener('play', wake);

// Zoom: pinch (touch) or wheel (mouse) toward the fingers/cursor, drag to pan while zoomed, 1× resets.
let z = 1, tx = 0, ty = 0;
const pts = new Map(); let gesture = null;
function applyZoom() {
  const w = vp.clientWidth, h = vp.clientHeight;
  z = Math.min(4, Math.max(1, z)); tx = Math.min(0, Math.max(w - w*z, tx)); ty = Math.min(0, Math.max(h - h*z, ty));
  v.style.transform = z === 1 ? '' : `translate(${tx}px, ${ty}px) scale(${z})`; $('#zoomReset').hidden = z === 1;
}
function resetZoom() { z = 1; tx = ty = 0; applyZoom(); }
function zoomAt(nz, px, py, base = { z, tx, ty }) { const cx = (px - base.tx)/base.z, cy = (py - base.ty)/base.z; z = nz; tx = px - cx*z; ty = py - cy*z; applyZoom(); }
$('#zoomReset').onclick = resetZoom;
const local = (e) => { const r = vp.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
vp.addEventListener('wheel', (e) => { e.preventDefault(); const p = local(e); zoomAt(z * Math.exp(-e.deltaY * 0.0015), p.x, p.y); }, { passive:false });
vp.addEventListener('pointerdown', (e) => {
  vp.setPointerCapture(e.pointerId); pts.set(e.pointerId, local(e));
  const [a, b] = [...pts.values()];
  if (pts.size === 1) gesture = { kind:'pan', start:a, base:{ z, tx, ty }, moved:false, at:Date.now(), wasIdle:vp.classList.contains('idle') };
  else if (pts.size === 2) gesture = { kind:'pinch', d:Math.hypot(a.x-b.x, a.y-b.y), m:{ x:(a.x+b.x)/2, y:(a.y+b.y)/2 }, base:{ z, tx, ty }, moved:true };
  wake();
});
vp.addEventListener('pointermove', (e) => {
  if (!pts.has(e.pointerId) || !gesture) return;
  pts.set(e.pointerId, local(e)); const [a, b] = [...pts.values()];
  if (gesture.kind === 'pinch' && b) {
    const m = { x:(a.x+b.x)/2, y:(a.y+b.y)/2 }, nz = gesture.base.z * Math.hypot(a.x-b.x, a.y-b.y) / gesture.d;
    const cx = (gesture.m.x - gesture.base.tx)/gesture.base.z, cy = (gesture.m.y - gesture.base.ty)/gesture.base.z;
    z = nz; tx = m.x - cx*z; ty = m.y - cy*z; applyZoom();
  } else if (gesture.kind === 'pan') {
    const dx = a.x - gesture.start.x, dy = a.y - gesture.start.y;
    if (Math.hypot(dx, dy) > 8) gesture.moved = true;
    if (gesture.moved && z > 1) { tx = gesture.base.tx + dx; ty = gesture.base.ty + dy; applyZoom(); }
  }
});
function endPointer(e) {
  pts.delete(e.pointerId);
  if (gesture?.kind === 'pan' && !gesture.moved && Date.now() - gesture.at < 400 && !gesture.wasIdle) togglePlay();
  if (pts.size === 1) { const [a] = pts.values(); gesture = { kind:'pan', start:a, base:{ z, tx, ty }, moved:true }; } else if (!pts.size) gesture = null;
}
vp.addEventListener('pointerup', endPointer); vp.addEventListener('pointercancel', endPointer);
addEventListener('resize', applyZoom); document.addEventListener('fullscreenchange', () => { resetZoom(); renderEvents(); });

// Clips
function updateRange() { const rg = $('#rg'); const D = dur(); if (inT!=null && outT!=null && outT>inT) { rg.style.left = (inT/D*100)+'%'; rg.style.width = ((outT-inT)/D*100)+'%'; $('#range').textContent = `${fmt(inT)} → ${fmt(outT)}`; } else { rg.style.width = '0'; $('#range').textContent = inT!=null ? `in ${fmt(inT)}` : (outT!=null ? `out ${fmt(outT)}` : 'no range'); } }
$('#setIn').onclick = () => { inT = v.currentTime; updateRange(); };
$('#setOut').onclick = () => { outT = v.currentTime; updateRange(); };
$('#cut').onclick = async () => { if (inT==null || outT==null || outT<=inT) return $('#cutMsg').textContent = 'set In and Out first'; $('#cutMsg').textContent = 'cutting…'; try { await api('/api/recordings/' + encodeURIComponent(cur.id) + '/clip', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ start: inT, end: outT, precise: $('#precise').checked, name: $('#clipName').value }) }); $('#cutMsg').textContent = 'done'; const t = v.currentTime; await select(cur.id); seek(t); await loadList(); } catch (e) { $('#cutMsg').textContent = 'failed: ' + e.message; } };
$('#fav').onclick = async () => { const t = v.currentTime, playing = !v.paused; await api('/api/recordings/' + encodeURIComponent(cur.id) + '/favorite', { method:'POST' }); await loadList(); await select(cur.id); seek(t, playing); };
$('#del').onclick = async () => { if (!confirm(`Delete "${cur.id}" and its clips?`)) return; await api('/api/recordings/' + encodeURIComponent(cur.id), { method:'DELETE' }); cur = null; v.removeAttribute('src'); $('#player').hidden = true; $('#empty').hidden = false; await loadList(); };
$('#open').onclick = () => { navigator.clipboard?.writeText(cur.file); alert('File: ' + cur.file + '\n(in your Replay Capture library folder; name copied)'); };
function renderClips() {
  const el = $('#clips'); el.innerHTML = cur.clips.length ? '' : '<span class="muted">No clips yet. Set In and Out, then press Clip.</span>';
  for (const c of cur.clips) { const d = document.createElement('div'); d.className = 'clip'; const jpg = c.file.replace(/\.mp4$/, '.jpg');
    d.innerHTML = `<a href="/media/clips/${encodeURIComponent(c.file)}" target="_blank"><img src="/media/clips/${encodeURIComponent(jpg)}" onerror="this.style.visibility='hidden'"></a><div><span>${fmt(c.start)}–${fmt(c.end)} · ${gb(c.sizeBytes)}</span><button class="danger" title="delete clip">✕</button></div>`;
    d.querySelector('button').onclick = async () => { if (!confirm('Delete clip?')) return; await api(`/api/recordings/${encodeURIComponent(cur.id)}/clips/${encodeURIComponent(c.file)}`, { method:'DELETE' }); await select(cur.id); await loadList(); };
    el.appendChild(d); }
}
document.addEventListener('keydown', (e) => { if (e.target.tagName==='INPUT' || !cur) return; if (e.key==='i') $('#setIn').click(); if (e.key==='o') $('#setOut').click(); if (e.key===' ') { e.preventDefault(); togglePlay(); } if (e.key==='ArrowLeft') seek(v.currentTime - 5); if (e.key==='ArrowRight') seek(v.currentTime + 5); const i = RATES.indexOf(rate); if (e.key==='>' && i < RATES.length-1) setRate(RATES[i+1]); if (e.key==='<' && i > 0) setRate(RATES[i-1]); });
loadList().then(() => { if (compact.matches && !cur) setDrawer(true); }); refreshStatus(); setInterval(refreshStatus, 3000); setInterval(loadList, 30000);
</script>
